name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.9
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: app

      - name: Run tests
        run: flutter test
        working-directory: app

      - name: Build Windows release
        run: flutter build windows --release
        working-directory: app

      - name: Package Windows build
        shell: pwsh
        run: |
          # 1. Pre-bundle yt-dlp resolver executable into release build directory
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12 -bor [Net.SecurityProtocolType]::Tls13
          # Pinned release. To bump: pick a tag from github.com/yt-dlp/yt-dlp/releases, then copy the
          # yt-dlp.exe line from that release's SHA2-256SUMS (and confirm it against the downloaded file).
          $ytVersion = "2026.08.19"
          $ytSha256 = "66674953fe251b89f4d08c5f0e35e0728679bd67ab3d7d05c0562af101dd3e7a"
          $ytUrl = "https://github.com/yt-dlp/yt-dlp/releases/download/$ytVersion/yt-dlp.exe"
          $ytDest = "app/build/windows/x64/runner/Release/yt-dlp.exe"
          Write-Host "Downloading $ytUrl to $ytDest..."
          Invoke-WebRequest -Uri $ytUrl -OutFile $ytDest -UserAgent "PearMusic-CI"
          $actual = (Get-FileHash -Algorithm SHA256 $ytDest).Hash.ToLower()
          if ($actual -ne $ytSha256) { throw "yt-dlp.exe $ytVersion checksum mismatch: expected $ytSha256, got $actual" }
          Write-Host "yt-dlp.exe $ytVersion SHA-256 verified: $actual"

          # 2. Bundle install and uninstall scripts
          Copy-Item "tool/install.ps1" "app/build/windows/x64/runner/Release/install.ps1"
          Copy-Item "tool/Install.bat" "app/build/windows/x64/runner/Release/Install.bat"
          Copy-Item "tool/uninstall.ps1" "app/build/windows/x64/runner/Release/uninstall.ps1"
          Copy-Item "tool/Uninstall.bat" "app/build/windows/x64/runner/Release/Uninstall.bat"

          # 3. Compile Inno Setup installer
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue)?.Source
          }
          if (-not $iscc) {
            choco install innosetup --no-progress -y
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          Write-Host "Compiling installer using $iscc..."
          & $iscc "tool/installer.iss"
          Copy-Item "tool/PearMusic-Windows-Setup.exe" "PearMusic-Windows-Setup.exe"

          # 4. Package zip archive
          Compress-Archive -Path "app/build/windows/x64/runner/Release/*" -DestinationPath "PearMusic-Windows-x64.zip" -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: PearMusic-Windows-x64
          path: |
            PearMusic-Windows-x64.zip
            PearMusic-Windows-Setup.exe

  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.9
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: app

      - name: Run tests
        run: flutter test
        working-directory: app

      - name: Decode release keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE }}" | base64 -d > android/app/peerm-release.jks
        working-directory: app

      - name: Generate key.properties
        run: |
          cat <<EOF > android/key.properties
          storePassword=${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.RELEASE_KEY_PASSWORD }}
          keyAlias=${{ secrets.RELEASE_KEY_ALIAS }}
          storeFile=app/peerm-release.jks
          EOF
        working-directory: app

      - name: Build Android release APKs
        run: flutter build apk --split-per-abi --release
        working-directory: app

      - name: Stage Android artifacts
        run: |
          cp app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk PearMusic-Android-arm64.apk
          cp app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk PearMusic-Android-armv7.apk

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PearMusic-Android
          path: |
            PearMusic-Android-arm64.apk
            PearMusic-Android-armv7.apk

  publish:
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: PearMusic-Windows-x64
          path: .

      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: PearMusic-Android
          path: .

      - name: Generate checksums
        run: |
          h1=$(sha256sum PearMusic-Windows-Setup.exe | cut -d' ' -f1)
          h2=$(sha256sum PearMusic-Windows-x64.zip | cut -d' ' -f1)
          h3=$(sha256sum PearMusic-Android-arm64.apk | cut -d' ' -f1)
          h4=$(sha256sum PearMusic-Android-armv7.apk | cut -d' ' -f1)
          printf '%s *PearMusic-Windows-Setup.exe\n%s *PearMusic-Windows-x64.zip\n%s *PearMusic-Android-arm64.apk\n%s *PearMusic-Android-armv7.apk\n' "$h1" "$h2" "$h3" "$h4" > SHA256SUMS

      - name: Generate release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # actions/checkout leaves the pushed tag as a lightweight ref, which
          # makes %(contents) read the tip commit's message instead of the tag's.
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          PREV_TAG=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || echo "")
          TAG_SUBJECT=$(git tag -l --format='%(contents:subject)' "$TAG")
          TAG_BODY=$(git tag -l --format='%(contents:body)' "$TAG" | sed -E '/^(Co-Authored-By|Claude-Session|Signed-off-by):/Id')
          CLEAN_SUBJECT=$(echo "$TAG_SUBJECT" | sed -E 's/^release:[[:space:]]*v?[0-9.]+[[:space:]]*-[[:space:]]*//I')

          {
            echo "## Overview"
            if [ -n "$CLEAN_SUBJECT" ]; then
              echo "$CLEAN_SUBJECT"
            else
              echo "Pear Music ${TAG#v} release."
            fi

            if [ -n "$TAG_BODY" ]; then
              echo ""
              echo "$TAG_BODY"
            fi
            echo ""

            echo "## Key Changes"
            if [ -n "$PREV_TAG" ]; then
              git log "${PREV_TAG}..${TAG}" --no-merges --pretty=format:"* %s (%h)"
              echo ""
              echo ""
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${TAG}"
            else
              git log -n 15 --no-merges --pretty=format:"* %s (%h)"
            fi
            echo ""
            echo ""
            echo "## Verification (SHA-256)"
            echo '```'
            cat SHA256SUMS
            echo '```'
          } > RELEASE_NOTES.md

      - name: Sign app update manifest
        env:
          SIGNING_KEY: ${{ secrets.YTDLP_SIGNING_KEY }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          MIRROR_BASES: https://github.com/Boci0/pm-resolver-mirror/releases/download/app-update
          NOTES_FILE: RELEASE_NOTES.md
        run: |
          # The app only installs updates it can check against this signature, so a
          # release without it still publishes but the app points users at the page.
          if [ -z "$SIGNING_KEY" ]; then
            echo "::warning::YTDLP_SIGNING_KEY is not set, publishing without a signed app-update manifest"
            exit 0
          fi
          key="$RUNNER_TEMP/app-update-signing.pem"
          (umask 077; printf '%s\n' "$SIGNING_KEY" > "$key")
          bash tool/app_update_sign_manifest.sh . "${TAG#v}" "$key"
          rm -f "$key"

      - name: Create or update GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          EXTRA=()
          for f in app-update.json app-update.json.sig; do
            [ -f "$f" ] && EXTRA+=("$f")
          done
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $TAG already exists; uploading release assets with clobber"
            gh release upload "$TAG" \
              PearMusic-Android-arm64.apk PearMusic-Android-armv7.apk PearMusic-Windows-Setup.exe PearMusic-Windows-x64.zip SHA256SUMS "${EXTRA[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            gh release edit "$TAG" --notes-file RELEASE_NOTES.md --draft=false --latest --repo "$GITHUB_REPOSITORY"
          else
            echo "Creating release $TAG"
            gh release create "$TAG" \
              PearMusic-Android-arm64.apk PearMusic-Android-armv7.apk PearMusic-Windows-Setup.exe PearMusic-Windows-x64.zip SHA256SUMS "${EXTRA[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Pear Music ${TAG#v}" \
              --notes-file RELEASE_NOTES.md
            gh release edit "$TAG" --draft=false --latest --repo "$GITHUB_REPOSITORY"
          fi

      # A second copy of the app files and the signed manifest in the separate
      # mirror repository, so updates keep working if this repository is taken
      # down. Best effort: the manifest lists these URLs, and the app tries the
      # next host when one does not answer.
      - name: Publish app update to the mirror repository
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.MIRROR_REPO_TOKEN }}
          MIRROR_REPO: Boci0/pm-resolver-mirror
          MIRROR_TAG: app-update
        run: |
          if [ -z "$GH_TOKEN" ] || [ ! -f app-update.json ]; then
            echo "::warning::No mirror token or no signed manifest, skipping the app update mirror"
            exit 0
          fi
          if ! gh release view "$MIRROR_TAG" --repo "$MIRROR_REPO" > /dev/null 2>&1; then
            gh release create "$MIRROR_TAG" --repo "$MIRROR_REPO" \
              --title "App update" \
              --notes "Copies of the latest app files for the in-app updater." \
              --prerelease --latest=false
          fi
          # Files first, manifest last: the manifest is what the app trusts.
          gh release upload "$MIRROR_TAG" --repo "$MIRROR_REPO" --clobber \
            PearMusic-Android-arm64.apk PearMusic-Android-armv7.apk \
            PearMusic-Windows-Setup.exe PearMusic-Windows-x64.zip
          gh release upload "$MIRROR_TAG" --repo "$MIRROR_REPO" --clobber \
            app-update.json app-update.json.sig
