name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.9
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: app

      - name: Run tests
        run: flutter test
        working-directory: app

      - name: Build Windows release
        run: flutter build windows --release
        working-directory: app

      - name: Package Windows build
        run: Compress-Archive -Path "app/build/windows/x64/runner/Release/*" -DestinationPath "PearMusic-Windows-x64.zip" -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: PearMusic-Windows-x64
          path: PearMusic-Windows-x64.zip

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.9
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: app

      - name: Run tests
        run: flutter test
        working-directory: app

      - name: Decode release keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE }}" | base64 -d > android/app/peerm-release.jks
        working-directory: app

      - name: Generate key.properties
        run: |
          cat <<EOF > android/key.properties
          storePassword=${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.RELEASE_KEY_PASSWORD }}
          keyAlias=${{ secrets.RELEASE_KEY_ALIAS }}
          storeFile=app/peerm-release.jks
          EOF
        working-directory: app

      - name: Build Android release APKs
        run: flutter build apk --split-per-abi --release
        working-directory: app

      - name: Stage Android artifacts
        run: |
          cp app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk PearMusic-Android-arm64.apk
          cp app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk PearMusic-Android-armv7.apk

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PearMusic-Android
          path: |
            PearMusic-Android-arm64.apk
            PearMusic-Android-armv7.apk

  publish:
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: PearMusic-Windows-x64
          path: .

      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: PearMusic-Android
          path: .

      - name: Generate checksums
        run: |
          h1=$(sha256sum PearMusic-Windows-x64.zip | cut -d' ' -f1)
          h2=$(sha256sum PearMusic-Android-arm64.apk | cut -d' ' -f1)
          h3=$(sha256sum PearMusic-Android-armv7.apk | cut -d' ' -f1)
          printf '%s *PearMusic-Windows-x64.zip\n%s *PearMusic-Android-arm64.apk\n%s *PearMusic-Android-armv7.apk' "$h1" "$h2" "$h3" > SHA256SUMS

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            PearMusic-Android-arm64.apk PearMusic-Android-armv7.apk PearMusic-Windows-x64.zip SHA256SUMS \
            --title "Pear Music ${TAG#v}" \
            --generate-notes

