org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Some plugin dependencies require compileSdk 36+; permission_handler_android
# (for the Android 13+ notification permission) requires 37.
flutter.compileSdkVersion=37
# Ensure a recent minSdk for modern plugins (file_picker, mobile_scanner, etc.)
flutter.minSdkVersion=23
# Disable AAR metadata validation for problematic plugins (file_picker v7.x)
android.disableResourceValidation=true
